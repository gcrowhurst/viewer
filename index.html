<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HTML Preview</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #111; color: #ccc; height: 100vh; display: flex; flex-direction: column; }

  #paste-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px;
  }

  label { font-size: 13px; color: #666; }

  textarea {
    width: 100%;
    max-width: 700px;
    height: 260px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #e0e0e0;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.6;
    padding: 14px;
    resize: vertical;
    outline: none;
    tab-size: 2;
  }
  textarea:focus { border-color: #555; }

  button {
    font-family: monospace;
    font-size: 14px;
    font-weight: bold;
    padding: 10px 32px;
    background: #00ff33;
    color: #000;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #00cc29; }

  #preview-screen {
    display: none;
    flex: 1;
    flex-direction: column;
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    background: #111;
    border-bottom: 1px solid #222;
    flex-shrink: 0;
  }

  .back-btn {
    font-family: monospace;
    font-size: 12px;
    padding: 4px 12px;
    background: #222;
    color: #ccc;
    border: 1px solid #444;
    border-radius: 5px;
    cursor: pointer;
  }
  .back-btn:hover { border-color: #aaa; color: #fff; }

  iframe {
    flex: 1;
    border: none;
    width: 100%;
  }
</style>
</head>
<body>

<div id="paste-screen">
  <label>Paste your HTML then click Run</label>
  <textarea id="code" spellcheck="false" placeholder="Paste HTML here..."></textarea>
  <button id="runBtn">&#9654; Run</button>
</div>

<div id="preview-screen">
  <div class="topbar">
    <button class="back-btn" id="backBtn">&#8592; Back</button>
  </div>
  <iframe id="preview" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
</div>

<script>
  const code = document.getElementById('code');
  const preview = document.getElementById('preview');
  const pasteScreen = document.getElementById('paste-screen');
  const previewScreen = document.getElementById('preview-screen');

  function run() {
    if (!code.value.trim()) return;
    const doc = preview.contentDocument || preview.contentWindow.document;
    doc.open();
    doc.write(code.value);
    doc.close();
    pasteScreen.style.display = 'none';
    previewScreen.style.display = 'flex';
  }

  document.getElementById('runBtn').addEventListener('click', run);
  document.getElementById('backBtn').addEventListener('click', () => {
    pasteScreen.style.display = 'flex';
    previewScreen.style.display = 'none';
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run();
  });

  code.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = code.selectionStart;
      code.value = code.value.substring(0, s) + '  ' + code.value.substring(code.selectionEnd);
      code.selectionStart = code.selectionEnd = s + 2;
    }
  });
</script>

</body>
</html>
